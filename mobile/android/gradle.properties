org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin's incremental compiler can't compute a relative path between the pub-cache (C:) and
# this project (E:) on Windows -- "this and base files have different roots" -- crashing
# compileReleaseKotlin for any plugin with native Kotlin code (device_info_plus,
# speech_to_text). Disabling incremental compilation avoids the cross-drive relativeTo() call.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
